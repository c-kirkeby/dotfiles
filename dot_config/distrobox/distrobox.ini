[arch]
image=archlinux:latest
replace=true
pre_init_hooks="pacman -Syy --noconfirm"
pre_init_hooks="pacman -S --noconfirm archlinux-keyring"
pre_init_hooks="pacman-key --init"
pre_init_hooks="pacman-key --populate archlinux"
pre_init_hooks="pacman -Syu --noconfirm"
additional_packages="git nvim tmux fish fd ripgrep starship chezmoi fzf zoxide jq github-cli gcc python go make mise fastfetch rustup uv postgresql btop typst podman git-delta httpie tree-sitter-cli"
additional_packages="dotnet-runtime dotnet-sdk aspnet-runtime aspnet-targeting-pack"
additional_packages="dotnet-runtime-9.0 dotnet-sdk-9.0 aspnet-runtime-9.0 aspnet-targeting-pack-9.0"
init_hooks="curl -fsSL https://vite.plus | bash && ~/.vite-plus/bin/vp env setup"
init_hooks="~/.vite-plus/bin/vp install -g pnpm@latest"
init_hooks="~/.vite-plus/bin/vp install -g @github/copilot"
init_hooks="~/.vite-plus/bin/vp install -g opencode-ai"
init_hooks="~/.vite-plus/bin/vp install -g @anthropic-ai/claude-code"
init_hooks="~/.vite-plus/bin/vp install -g @mariozechner/pi-coding-agent"
init_hooks="~/.vite-plus/bin/vp install -g @devcontainers/cli"
init_hooks="~/.vite-plus/bin/vp install -g @playwright/cli@latest
init_hooks="~/.vite-plus/bin/pi install npm:pi-web-access"
init_hooks="~/.vite-plus/bin/pi install npm:oh-pi"
init_hooks="rustup default stable"
init_hooks="uv tool install specify-cli --from git+https://github.com/github/spec-kit.git"
init_hooks="curl -fsSL https://ollama.com/install.sh | sh"
init_hooks="curl -fsSL https://deno.land/install.sh | sh"

#init_hooks="curl -fsSL https://codecrafters.io/install.sh | bash"
init_hooks="chsh -s /usr/sbin/fish $USER"

[fedora]
image=fedora:rawhide
replace=true
additional_packages="fish automake gcc-c++ git hidapi-devel libusbx-devel mbedtls-devel pkgconf qt5-qtbase-devel qt5-linguist zoxide fzf"
init_hooks="dnf copr enable -y atim/starship"
init_hooks="dnf install -y starship"
init_hooks="chsh -s /usr/sbin/fish $USER"

[ubuntu]
image=ubuntu:latest
replace=true
pre_init_hooks="apt-get update && apt-get upgrade -y"
additional_packages="git nvim tmux fish fd ripgrep starship chezmoi fzf zoxide jq github-cli gcc python3 go make mise fastfetch rustup uv postgresql btop typst podman git-delta httpie tree-sitter-cli"
additional_packages="dotnet-runtime dotnet-sdk aspnet-runtime aspnet-targeting-pack"
additional_packages="dotnet-runtime-9.0 dotnet-sdk-9.0 aspnet-runtime-9.0 aspnet-targeting-pack-9.0"
init_hooks="curl -fsSL https://vite.plus | bash && ~/.vite-plus/bin/vp env setup"
init_hooks="~/.vite-plus/bin/vp install -g pnpm@latest"
init_hooks="~/.vite-plus/bin/vp install -g @github/copilot"
init_hooks="~/.vite-plus/bin/vp install -g opencode-ai"
init_hooks="~/.vite-plus/bin/vp install -g @anthropic-ai/claude-code"
init_hooks="~/.vite-plus/bin/vp install -g @mariozechner/pi-coding-agent"
init_hooks="~/.vite-plus/bin/vp install -g @devcontainers/cli"
init_hooks="~/.vite-plus/bin/vp install -g @playwright/cli@latest
init_hooks="~/.vite-plus/bin/pi install npm:pi-web-access"
init_hooks="~/.vite-plus/bin/pi install npm:oh-pi"
init_hooks="rustup default stable"
init_hooks="uv tool install specify-cli --from git+https://github.com/github/spec-kit.git"
init_hooks="curl -fsSL https://ollama.com/install.sh | sh"
init_hooks="curl -fsSL https://deno.land/install.sh | sh"

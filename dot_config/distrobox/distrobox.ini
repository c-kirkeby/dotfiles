[arch]
image=archlinux:latest
replace=true
pre_init_hooks="pacman -Syy --noconfirm"
pre_init_hooks="pacman -S --noconfirm archlinux-keyring"
pre_init_hooks="pacman-key --init"
pre_init_hooks="pacman-key --populate archlinux"
pre_init_hooks="pacman -Syu --noconfirm"
additional_packages="git nvim tmux nodejs npm fish fd ripgrep starship chezmoi fzf zoxide github-cli gcc python go make mise fastfetch rustup uv postgresql btop typst podman git-delta"
additional_packages="dotnet-runtime dotnet-sdk aspnet-runtime aspnet-targeting-pack"
additional_packages="dotnet-runtime-9.0 dotnet-sdk-9.0 aspnet-runtime-9.0 aspnet-targeting-pack-9.0"
init_hooks="npm install -g pnpm@latest"
init_hooks="npm install -g @github/copilot"
init_hooks="npm install -g opencode-ai"
init_hooks="npm install -g @anthropic-ai/claude-code"
init_hooks="npm install -g @mariozechner/pi-coding-agent"
init_hooks="pi install npm:pi-web-access"
init_hooks="pi install npm:oh-pi"
init_hooks="rustup default stable"
init_hooks="uv tool install specify-cli --from git+https://github.com/github/spec-kit.git"
#init_hooks="curl -fsSL https://codecrafters.io/install.sh | bash"
PATH="$PATH:$HOME/.cargo/bin"
init_hooks="chsh -s /usr/sbin/fish $USER"

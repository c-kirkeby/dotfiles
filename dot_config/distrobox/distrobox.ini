[arch]
image=archlinux:latest
replace=true
pull=true
root=false
start_now=true

pre_init_hooks="export SHELL=/bin/fish;"

additional_packages="fish starship fd fzf jq tmux nvim ripgrep chezmoi zoxide btop tree-sitter-cli httpie which fastfetch postgresql"
additional_packages="git github-cli git-delta gcc make mise clang lld libxkbcommon libxkbcommon-x11 noto-fonts fontconfig"
additional_packages="go rustup uv typst"
additional_packages="dotnet-runtime dotnet-sdk aspnet-runtime aspnet-targeting-pack"
additional_packages="dotnet-runtime-9.0 dotnet-sdk-9.0 aspnet-runtime-9.0 aspnet-targeting-pack-9.0"
init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman
# init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman-compose
init_hooks="curl -fsSL https://vite.plus | bash && ~/.vite-plus/bin/vp env setup"
init_hooks="~/.vite-plus/bin/vp install -g pnpm@latest @github/copilot opencode-ai @anthropic-ai/claude-code @earendil-works/pi-coding-agent @devcontainers/cli @playwright/cli@latest @capacitor/core @capacitor/cli"
init_hooks="~/.vite-plus/bin/pi install npm:pi-web-access"
init_hooks="~/.vite-plus/bin/pi install npm:oh-pi"
init_hooks="rustup default stable"
init_hooks="uv tool install specify-cli --from git+https://github.com/github/spec-kit.git"
init_hooks="curl -fsSL https://ollama.com/install.sh | sh"
init_hooks="curl -fsSL https://deno.land/install.sh | sh"
#init_hooks="curl -fsSL https://codecrafters.io/install.sh | bash"

[ubuntu]
image=ubuntu:latest
replace=true
pull=true
root=false

additional_packages="fish starship fd-find fzf jq tmux neovim ripgrep zoxide btop tree-sitter-cli httpie which fastfetch postgresql"
additional_packages="git gh git-delta gcc make"
additional_packages="golang rustup"
additional_packages="dotnet-sdk-10.0 aspnetcore-runtime-10.0"



# Set up plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# Set theme variant
set -g @catppuccin_flavour 'macchiato'

# Use terminal colours in tmux
set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g status-style bg=default
# set -g default-terminal "screen-256color"

# Change prefix from B to A
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix

# 1-index windows
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Alt-arrow to switch pane
bind -n M-left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to switch window
bind -n S-Left previous-window
bind -n S-Right next-window

# Change split to V and H
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Set vi mode
# set-window-option -g mode-keys v

# Mouse mode on
setw -g mouse on

# Reload tmux conf key
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux.conf reloaded."

# Init TPM
run '~/.config/tmux/plugins/tpm/tpm'

[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm"
    exact = true
[".config/ghostty/themes"]
    type = "archive"
    url = "https://github.com/catppuccin/ghostty/archive/refs/heads/main.zip"
    stripComponents = 1
    include = ["themes/*"]
[".config/ghostty/shaders"]
    type = "git-repo"
    url = "https://github.com/0xhckr/ghostty-shaders.git"
    include = ["*.glsl"]

